<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a1120" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="30%" r="48%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="84%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="curveClean" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Base Frame -->
  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#gridPattern)" />
  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#glowLeft)" />
  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#glowRight)" />
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left Content Area -->
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
    <!-- Top Pill -->
    <rect x="52" y="34" width="256" height="28" rx="14" fill="#0f2537" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="70" cy="48" r="4" fill="#38bdf8" />
    <text x="84" y="53" fill="#7dd3fc" font-size="12" font-weight="600" letter-spacing="1.2" font-family="'JetBrains Mono', Consolas, monospace">AGENT SKILL &amp; CLI TOOLKIT</text>

    <!-- Main Title -->
    <text x="52" y="114" fill="url(#titleGrad)" font-size="50" font-weight="800" letter-spacing="-0.5">LUT Inspector</text>
    <text x="54" y="146" fill="#94a3b8" font-size="16" font-weight="500" font-family="'JetBrains Mono', Consolas, monospace">lut-inspector · Cinema Monitoring 3D LUT Diagnostics &amp; Safe Sanitizer</text>

    <!-- Chinese Tagline -->
    <text x="52" y="186" fill="#e2e8f0" font-size="18" font-weight="600">专为 DaVinci Resolve + DCTL 与 Sony VENICE / FX6 / FX3 打造</text>
    <text x="52" y="213" fill="#94a3b8" font-size="15">提前拦截机内“斑马纹溢出回绕”与 S-Log3 黑位极暗部彩噪爆炸，支持一键安全重采样</text>

    <!-- Feature Badges -->
    <g font-size="13" font-weight="600">
      <rect x="52" y="242" width="146" height="34" rx="8" fill="#1f121d" stroke="#f43f5e" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="70" cy="259" r="4" fill="#f43f5e" />
      <text x="82" y="264" fill="#fda4af">斑马纹 / 溢出处决</text>

      <rect x="210" y="242" width="158" height="34" rx="8" fill="#0f2034" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="228" cy="259" r="4" fill="#38bdf8" />
      <text x="240" y="264" fill="#bae6fd">S-Log3 黑位仿真</text>

      <rect x="380" y="242" width="144" height="34" rx="8" fill="#21190c" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="398" cy="259" r="4" fill="#f59e0b" />
      <text x="410" y="264" fill="#fde68a">6 宫格科学面板</text>

      <rect x="536" y="242" width="146" height="34" rx="8" fill="#0b221c" stroke="#10b981" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="554" cy="259" r="4" fill="#10b981" />
      <text x="566" y="264" fill="#a7f3d0">33-pt 机内修复</text>
    </g>
  </g>

  <!-- Right Scope Monitor Widget -->
  <g>
    <rect x="748" y="30" width="408" height="260" rx="14" fill="#090e1a" stroke="#334155" stroke-width="1.2" />
    <!-- Top Monitor Header -->
    <rect x="748" y="30" width="408" height="34" rx="14" fill="#111827" />
    <rect x="748" y="50" width="408" height="14" fill="#111827" />
    <line x1="748" y1="64" x2="1156" y2="64" stroke="#1e293b" stroke-width="1" />
    <circle cx="770" cy="47" r="4.5" fill="#f43f5e" />
    <circle cx="785" cy="47" r="4.5" fill="#f59e0b" />
    <circle cx="800" cy="47" r="4.5" fill="#10b981" />
    <text x="818" y="51" fill="#cbd5e1" font-size="11.5" font-weight="600" font-family="'JetBrains Mono', Consolas, monospace">LUT SCOPE · S-LOG3 → REC.709 (33³)</text>

    <!-- Plot Grid inside Monitor -->
    <g stroke="#1e293b" stroke-width="0.8">
      <line x1="780" y1="92" x2="1128" y2="92" />
      <line x1="780" y1="132" x2="1128" y2="132" />
      <line x1="780" y1="172" x2="1128" y2="172" />
      <line x1="780" y1="212" x2="1128" y2="212" />
      <line x1="780" y1="252" x2="1128" y2="252" />
      <line x1="780" y1="84" x2="780" y2="258" />
      <line x1="867" y1="84" x2="867" y2="258" />
      <line x1="954" y1="84" x2="954" y2="258" />
      <line x1="1041" y1="84" x2="1041" y2="258" />
      <line x1="1128" y1="84" x2="1128" y2="258" />
    </g>

    <!-- Ceiling 1.0 & Black Floor 0.0 & S-Log3 Black Anchor -->
    <line x1="780" y1="102" x2="1128" y2="102" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,4" />
    <text x="786" y="96" fill="#fbbf24" font-size="10" font-family="'JetBrains Mono', Consolas, monospace">1.0 SAFE CEILING</text>

    <line x1="780" y1="248" x2="1128" y2="248" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,4" stroke-opacity="0.7" />
    <text x="1038" y="242" fill="#7dd3fc" font-size="10" font-family="'JetBrains Mono', Consolas, monospace">0.0 FLOOR</text>

    <line x1="813" y1="84" x2="813" y2="258" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4,3" />
    <text x="818" y="269" fill="#d8b4fe" font-size="10" font-family="'JetBrains Mono', Consolas, monospace">0.093 S-Log3 Black</text>

    <!-- Broken DCTL Curve (oscillating + wrap-around) -->
    <path d="M 780 251 L 806 254 L 814 236 L 824 247 L 860 226 C 905 198, 945 156, 985 130 C 1005 118, 1018 144, 1034 114 C 1048 88, 1064 90, 1076 92 L 1078 242 L 1128 242"
          fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3" stroke-opacity="0.88" />
    <circle cx="1076" cy="92" r="4" fill="#f59e0b" />
    <circle cx="1078" cy="242" r="4" fill="#f43f5e" />
    <text x="1032" y="83" fill="#fda4af" font-size="10" font-weight="600" font-family="system-ui, 'Microsoft YaHei', sans-serif">超白溢出回绕!</text>

    <!-- Clean Smooth S-Log3 Curve -->
    <path d="M 780 247 C 815 246, 845 236, 882 212 C 932 178, 976 132, 1032 114 C 1068 104, 1098 105, 1128 105"
          fill="none" stroke="url(#curveClean)" stroke-width="3" filter="url(#softGlow)" />

    <!-- Sample Lattice Dots -->
    <circle cx="813" cy="244" r="3.2" fill="#c084fc" stroke="#0f172a" stroke-width="1" />
    <circle cx="882" cy="212" r="3.2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
    <circle cx="954" cy="158" r="3.2" fill="#22d3ee" stroke="#0f172a" stroke-width="1" />
    <circle cx="1032" cy="114" r="3.2" fill="#34d399" stroke="#0f172a" stroke-width="1" />
    <circle cx="1128" cy="105" r="3.2" fill="#34d399" stroke="#0f172a" stroke-width="1" />

    <!-- Legend -->
    <line x1="780" y1="274" x2="800" y2="274" stroke="#22d3ee" stroke-width="2.5" />
    <text x="806" y="278" fill="#cbd5e1" font-size="10.5" font-family="system-ui, 'Microsoft YaHei', sans-serif">安全平滑曲线</text>
    <line x1="900" y1="274" x2="920" y2="274" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,2" />
    <text x="926" y="278" fill="#fda4af" font-size="10.5" font-family="system-ui, 'Microsoft YaHei', sans-serif">DCTL 故障/溢出回绕</text>
  </g>
</svg>
